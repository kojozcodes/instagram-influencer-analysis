<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Instagramインフルエンサー分析{% endblock %}</title>
  <style>
    :root { --brand:#1f4e78; --brand-dark:#163a5a; --bg:#f4f6f9; --err:#c0392b; --ok:#1e7e34; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
           background:var(--bg); color:#1a1a1a; line-height:1.6; }
    header { background:var(--brand); color:#fff; padding:18px 24px; }
    header h1 { margin:0; font-size:18px; font-weight:600; }
    main { max-width:900px; margin:28px auto; padding:0 20px; }
    .card { background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.08);
            padding:24px; margin-bottom:20px; }
    label { font-weight:600; display:block; margin-bottom:8px; }
    textarea { width:100%; min-height:180px; padding:12px; border:1px solid #ccd2da;
               border-radius:8px; font-size:14px; font-family:inherit; resize:vertical; }
    .hint { color:#5a6570; font-size:13px; margin-top:8px; }
    button { background:var(--brand); color:#fff; border:none; padding:12px 28px;
             font-size:15px; border-radius:8px; cursor:pointer; font-weight:600; }
    button:hover { background:var(--brand-dark); }
    .alert { background:#fdecea; color:var(--err); border:1px solid #f5c6c2;
             padding:12px 16px; border-radius:8px; margin-bottom:16px; font-size:14px; }
    .badge { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600; }
    .badge.ok { background:#e6f4ea; color:var(--ok); }
    .badge.err { background:#fdecea; color:var(--err); }
    table { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
    th,td { text-align:left; padding:8px 10px; border-bottom:1px solid #eef1f4; }
    th { color:#5a6570; font-weight:600; }
    .summary { display:flex; gap:24px; margin-bottom:16px; }
    .summary .num { font-size:26px; font-weight:700; }
    .dl { display:inline-block; background:var(--ok); color:#fff; text-decoration:none;
          padding:12px 24px; border-radius:8px; font-weight:600; }
    .dl:hover { background:#166129; }
    a.back { color:var(--brand); text-decoration:none; font-size:14px; }
    .provider-note { font-size:12px; color:#8a94a0; margin-top:6px; }
  </style>
</head>
<body>
  <header><h1>Instagramインフルエンサー分析システム</h1></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
